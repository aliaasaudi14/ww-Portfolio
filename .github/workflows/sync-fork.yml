name: Sync Basma Fork

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - name: Sync Basma Fork
        uses: actions/github-script@v8
        with:
          github-token: ${{ secrets.FORK_TOKEN }}
          script: |
            await github.rest.git.updateRef({
              owner: 'BasmaElHosseiny',
              repo: 'ww-Portfolio',
              ref: 'heads/main',
              sha: '${{ github.sha }}',
              force: true
            });

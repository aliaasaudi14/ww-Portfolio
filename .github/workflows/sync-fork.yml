name: Sync Basma Fork

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout original repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Push to Basma fork
        env:
          FORK_TOKEN: ${{ secrets.FORK_TOKEN }}
        run: |
          git remote remove origin
          git remote add origin https://x-access-token:${FORK_TOKEN}@github.com/BasmaElHosseiny/ww-Portfolio.git
          git push origin HEAD:main --force

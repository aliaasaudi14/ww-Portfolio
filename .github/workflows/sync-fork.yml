name: Sync Basma Fork

on:
  push:
    branches:
      - main

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - name: Sync fork
        uses: actions/github-script@v8
        with:
          github-token: ${{ secrets.FORK_TOKEN }}
          script: |
            const { data: repo } = await github.rest.repos.get({
              owner: 'BasmaElHosseiny',
              repo: 'ww-Portfolio'
            });

            await github.rest.git.updateRef({
              owner: 'BasmaElHosseiny',
              repo: 'ww-Portfolio',
              ref: 'heads/main',
              sha: '${{ github.sha }}',
              force: true
            });


name: Sync Basma Fork

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout original repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Push to Basma fork
        env:
          FORK_TOKEN: ${{ secrets.FORK_TOKEN }}
        run: |
          set -eu

          git remote remove origin
          git remote add origin https://github.com/BasmaElHosseiny/ww-Portfolio.git

          AUTH=$(printf 'x-access-token:%s' "$FORK_TOKEN" | base64 -w 0)

          git -c http.extraheader="AUTHORIZATION: basic $AUTH" push origin HEAD:main --force
